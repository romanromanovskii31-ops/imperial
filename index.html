<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>IMPERIAL TRANS CARGO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}

.container {
  max-width: 600px;
  margin: 100px auto;
  padding: 20px;
}

h1 {
  text-align: center;
}

form {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

input, textarea {
  padding: 12px;
  border: none;
  border-radius: 8px;
}

button {
  padding: 15px;
  background: #22c55e;
  border: none;
  color: white;
  font-size: 16px;
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <h1>IMPERIAL TRANS CARGO</h1>

  <form>
    <input type="text" name="name" placeholder="Ваше имя" required>
    <input type="tel" name="phone" placeholder="Телефон" required>
    <textarea name="cargo" placeholder="Описание груза" required></textarea>
    <button type="submit">Отправить заявку</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
(function(){
  emailjs.init("iBgRJG8GNtKKEUoBM");
})();

document.querySelector("form").addEventListener("submit", function(e) {
  e.preventDefault();

  emailjs.send("service_nsvynwu", "template_daooa4d", {
    name: this.name.value,
    phone: this.phone.value,
    cargo: this.cargo.value
  }).then(function() {
    alert("Заявка отправлена!");
  }, function(error) {
    alert("Ошибка: " + JSON.stringify(error));
  });
});
</script>

</body>
</html>
