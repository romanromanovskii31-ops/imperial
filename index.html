<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){
emailjs.init("YAEhiFYVjeawWDEi63RLQ");
})();
</script>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1220;
color:#fff;
}

header{
display:flex;
justify-content:space-between;
padding:20px 40px;
align-items:center;
}

.logo{
font-size:22px;
font-weight:bold;
color:#f2d27a;
}

.hero{
text-align:center;
padding:100px 20px;
}

.section{
padding:60px 20px;
text-align:center;
}

.cards{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
}

.card{
background:#121a2f;
padding:20px;
border-radius:10px;
width:250px;
}

.form{
background:#121a2f;
padding:40px;
border-radius:10px;
max-width:400px;
margin:0 auto;
}

input{
width:100%;
margin:10px 0;
padding:10px;
border-radius:6px;
border:none;
}

.btn{
padding:12px;
background:#f2d27a;
color:#000;
border:none;
border-radius:20px;
cursor:pointer;
width:100%;
}

.contacts a{
display:inline-block;
margin:10px;
padding:10px 20px;
background:#f2d27a;
color:#000;
border-radius:20px;
text-decoration:none;
}

#msg{
margin-top:10px;
font-weight:bold;
}
</style>
</head>

<body>

<header>
<div class="logo">ИМПЕРИАЛ TRANS CARGO</div>
</header>

<div class="hero">
<h1>Международные грузоперевозки</h1>
<p>Европа • СНГ • Азия</p>
</div>

<div class="section">
<h2>Наши услуги</h2>
<div class="cards">
<div class="card">Автоперевозки</div>
<div class="card">ЖД перевозки</div>
<div class="card">Морские контейнеры</div>
<div class="card">Экспедирование</div>
</div>
</div>

<div class="section">
<h2>Оставить заявку</h2>

<div class="form">
<form onsubmit="sendForm(event)">
<input id="name" placeholder="Имя">
<input id="phone" placeholder="Телефон">
<input id="cargo" placeholder="Груз">
<button class="btn">Отправить заявку</button>
</form>
<p id="msg"></p>
</div>

</div>

<div class="section contacts">
<h2>Контакты</h2>
<a href="https://wa.me/79103273958">WhatsApp</a>
<a href="https://t.me/imperialcargo">Telegram</a>
<a href="mailto:romanromanovskii31@gmail.com">Почта</a>
</div>

<script>
function sendForm(e){
e.preventDefault();

var name = document.getElementById('name').value.trim();
var phone = document.getElementById('phone').value.trim();
var cargo = document.getElementById('cargo').value.trim();

if(!name || !phone || !cargo){
document.getElementById("msg").innerText="Заполните все поля";
return;
}

emailjs.send("service_nsvynwu","template_daooa4d",{
name: name,
phone: phone,
cargo: cargo
})
.then(function(){
document.getElementById("msg").innerText="Заявка отправлена ✅";
}, function(error){
document.getElementById("msg").innerText="Ошибка ❌";
console.log(error);
});
}
</script>

</body>
</html>
