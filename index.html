<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMPERIAL TRANS CARGO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#020617;color:#fff;padding-top:80px;}
.container{max-width:1200px;margin:auto;padding:20px}

.header{
position:fixed;top:0;width:100%;z-index:999;
background:rgba(2,6,23,0.7);
backdrop-filter:blur(10px);
border-bottom:1px solid rgba(255,255,255,0.05);
}
.header-inner{
max-width:1200px;margin:auto;
display:flex;justify-content:space-between;align-items:center;
padding:15px 20px;
}
.logo img{height:40px}

.lang button{
margin-left:8px;padding:6px 10px;border:none;
border-radius:6px;background:#0f172a;color:#fff;cursor:pointer;
}
.lang button:hover{background:#22c55e}

.hero{
height:95vh;border-radius:20px;
background:linear-gradient(120deg,#020617cc,transparent),
url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d') center/cover;
display:flex;align-items:center;
}

.hero-content{padding:60px}
.hero h1{font-size:52px}
.hero span{color:#22c55e}

.btn{
padding:14px 26px;border-radius:14px;
background:#22c55e;color:#fff;text-decoration:none;
display:inline-block;margin-top:20px;
}

.section{margin:100px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}

.card{
background:rgba(15,23,42,.6);
padding:20px;border-radius:16px;
transition:.3s;
}
.card:hover{transform:translateY(-6px)}

img{width:100%;border-radius:12px}

.whatsapp{
position:fixed;bottom:20px;right:20px;
background:#25D366;padding:15px;border-radius:50%;
color:#fff;text-decoration:none;
}
</style>
</head>

<header class="header">

<div class="card"><img src="https://images.unsplash.com/photo-1554224155-6726b3ff858f">📑 <span data-key="s6"></span></div>

</div>
</div>

<div class="section">
<h2 data-key="extra"></h2>
<div class="grid">
<div class="card">💳 <span data-key="e1"></span></div>
<div class="card">🌍 <span data-key="e2"></span></div>
<div class="card">📦 <span data-key="e3"></span></div>
<div class="card">📑 <span data-key="e4"></span></div>
</div>
</div>

<div class="section">
<h2 data-key="customs"></h2>
<div class="card" data-key="customs_text"></div>
</div>

<div class="section">
<h2 data-key="offices"></h2>
<div class="grid">
<div class="card" data-key="office1"></div>
<div class="card" data-key="office2"></div>
<div class="card" data-key="office3"></div>
</div>
</div>

<div class="section">

<div class="grid">
<div class="card" data-key="case1"></div>
<div class="card" data-key="case2"></div>
<div class="card" data-key="case3"></div>
</div>
</div>

<div class="section">
<div class="card" style="text-align:center">

</div>
</div>

<div class="section" id="form">
<h2 data-key="form"></h2>
<form onsubmit="sendForm(event)">
<input id="name" data-key="name">
<input id="phone" data-key="phone">
<textarea id="msg" data-key="msg"></textarea>
<button class="btn" data-key="send"></button>
</form>
<p id="status"></p>
</div>

</div>

<a href="https://wa.me/79103273958" class="whatsapp">💬</a>

(function(){emailjs.init("iBgRJG8GNtKKEUoBM");})();

const BOT_TOKEN="ТВОЙ_ТОКЕН";
const CHAT_ID="ТВОЙ_CHAT";

function sendForm(e){
e.preventDefault();
let text=`Заявка: ${name.value} ${phone.value} ${msg.value}`;
fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({chat_id:CHAT_ID,text:text})
});
emailjs.send("service_nsvynwu","template_daooa4d",{message:text});
status.innerText="Отправлено";
}

function setLang(lang){
document.querySelectorAll("[data-key]").forEach(el=>{
let key=el.dataset.key;
if(el.tagName==="INPUT"||el.tagName==="TEXTAREA"){
el.placeholder=t[lang][key]||"";
}else{
el.innerText=t[lang][key]||"";
}
});
