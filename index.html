<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ИМПЕРИАЛ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){ emailjs.init("iBgRJG8GNtKKEUoBM"); })();
</script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

.container {
  padding: 40px 20px;
  text-align: center;
}

.logo {
  font-size: 36px;
  margin-bottom: 5px;
}

.sublogo {
  font-size: 12px;
  letter-spacing: 2px;
  color: #9ca3af;
  margin-top: 0;
}

.section {
  margin-top: 40px;
}

input, textarea {
  width: 90%;
  max-width: 400px;
  padding: 12px;
  margin: 10px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 12px 25px;
  background: #22c55e;
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #16a34a;
}

.success { color: #4ade80; }
.error { color: #f87171; }

.whatsapp {
  display: inline-block;
  margin-top: 20px;
  color: #25D366;
  font-size: 18px;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">ИМПЕРИАЛ</div>
<div class="sublogo">TRANS CARGO</div>

<p>Международные грузоперевозки</p>

<div class="section">
<h2>Услуги</h2>
<p>🚛 Автомобильные перевозки</p>
<p>📦 Сборные грузы</p>
<p>🌍 Россия — Грузия — Европа</p>
</div>

<div class="section">
<h2>Оставить заявку</h2>

<form id="form">
<input type="text" name="name" placeholder="Ваше имя" required>
<input type="tel" name="phone" placeholder="Телефон" required>
<textarea name="cargo" placeholder="Описание груза" required></textarea>

<button type="submit">Отправить заявку</button>
</form>

<div id="status"></div>

<a class="whatsapp" href="https://wa.me/79103273958" target="_blank">
📲 Написать в WhatsApp
</a>

</div>

<div class="section">
<h2>Контакты</h2>
<p>📞 +7 910 327-39-58</p>
<p>📩 imperialtranscargo@gmail.com</p>
</div>

</div>

<script>
const form = document.getElementById("form");
const status = document.getElementById("status");

form.addEventListener("submit", function(e) {
  e.preventDefault();

  status.innerHTML = "Отправка...";

  emailjs.sendForm(
    "service_z4k9k7r",
    "template_7p1n4jz",
    this
  )
  .then(() => {
    status.innerHTML = "<div class='success'>Заявка отправлена ✅</div>";
    form.reset();
  })
  .catch(() => {
    status.innerHTML = "<div class='error'>Ошибка отправки ❌</div>";
  });
});
</script>

</body>
</html>
