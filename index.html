<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMPERIAL TRANS CARGO</title>

<style>
body{margin:0;font-family:Arial;background:#020617;color:white;}
.container{max-width:1000px;margin:auto;padding:40px 20px;}
h1{font-size:40px;}
.btn{
padding:12px 20px;
background:#22c55e;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:10px;
}
input,select,textarea{
width:100%;
padding:10px;
margin:8px 0;
border-radius:6px;
border:none;
}
</style>
</head>

<body>

<div class="container">
<h1>IMPERIAL TRANS CARGO</h1>
<p>Оставьте заявку</p>

<form onsubmit="sendForm(event)">
<input type="text" id="name" placeholder="Имя" required>
<input type="text" id="phone" placeholder="Телефон" required>

<select id="type">
<option>Авто</option>
<option>Авиа</option>
<option>Море</option>
<option>Карго</option>
</select>

<textarea id="msg" placeholder="Описание груза"></textarea>

<button class="btn">Отправить</button>
</form>

<p id="status"></p>
</div>

<script>

function sendForm(e){
e.preventDefault();

let status = document.getElementById("status");

let nameVal = document.getElementById("name").value;
let phoneVal = document.getElementById("phone").value;
let typeVal = document.getElementById("type").value;
let msgVal = document.getElementById("msg").value;

let text = `🚚 Новая заявка:
Имя: ${nameVal}
Телефон: ${phoneVal}
Тип: ${typeVal}
Груз: ${msgVal}`;

let url = "https://api.telegram.org/bot8633180088:AAG-ZzRIFeyE2dy_6rsZt70MOMfytQeACGY/sendMessage"
+ "?chat_id=1118097651"
+ "&text=" + encodeURIComponent(text);

fetch(url)
.then(()=>{
status.innerText="Заявка отправлена ✅";
document.querySelector("form").reset();
})
.catch(()=>{
status.innerText="Ошибка ❌";
});
}

</script>

</body>
</html>
