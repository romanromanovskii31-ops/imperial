<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИМПЕРИАЛ TRANS CARGO</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){
emailjs.init("iBgRJG8GNtKKEUoBM");
})();
</script>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1220;
color:#fff;
text-align:center;
}

.header{
padding:20px;
}

.main{
font-size:26px;
color:#f2d27a;
font-weight:bold;
}

.sub{
font-size:12px;
opacity:.6;
}

.hero{
padding:60px;
}

.btn{
padding:12px 25px;
background:#f2d27a;
color:#000;
border-radius:20px;
text-decoration:none;
display:inline-block;
margin-top:10px;
}

input{
display:block;
margin:10px auto;
padding:10px;
width:250px;
border-radius:6px;
border:none;
}
</style>
</head>

<body>

<div class="header">
<div class="main">ИМПЕРИАЛ</div>
<div class="sub">TRANS CARGO</div>
</div>

<div class="hero">
<h1>Международные грузоперевозки</h1>
<p>Европа • СНГ • Азия</p>
</div>

<form onsubmit="sendForm(event)">
<input id="name" placeholder="Имя">
<input id="phone" placeholder="Телефон">
<input id="cargo" placeholder="Груз">

<button class="btn">Отправить</button>
</form>

<p id="msg"></p>

<a class="btn" href="https://wa.me/79103273958">WhatsApp</a>

<script>
function sendForm(e){
e.preventDefault();

var name = document.getElementById('name').value;
var phone = document.getElementById('phone').value;
var cargo = document.getElementById('cargo').value;

// ТОЧНО КАК ВЧЕРА
emailjs.send("service_rjz7d2c","template_6w4m9kf",{
name: name,
phone: phone,
cargo: cargo
});

document.getElementById("msg").innerText="Отправлено!";
}
</script>

</body>
</html>
