<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИМПЕРИАЛ TRANS CARGO</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){
emailjs.init("iBgRJG8GNtKKEUoBM");
})();
</script>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background: radial-gradient(circle at top, #111a33, #0b1220 60%);
color:#fff;
}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 60px;
}

.logo-text .main{
font-size:24px;
font-weight:700;
color:#f2d27a;
}

.logo-text .sub{
font-size:11px;
opacity:.6;
}

.lang button{
margin-left:5px;
background:none;
border:1px solid #444;
color:#fff;
padding:5px;
cursor:pointer;
}

/* HERO */
.hero{
padding:100px 20px;
text-align:center;
}

.btn{
padding:14px 30px;
background:#f2d27a;
color:#000;
border-radius:30px;
text-decoration:none;
display:inline-block;
margin-top:10px;
}

/* BLOCK */
.container{
padding:50px 20px;
text-align:center;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:6px;
border:none;
}
</style>
</head>

<body>

<div class="header">
<div class="logo-text">
<div class="main">ИМПЕРИАЛ</div>
<div class="sub">TRANS CARGO</div>
</div>

<div class="lang">
<button onclick="setLang('ru')">RU</button>
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('ge')">GE</button>
</div>
</div>

<div class="hero">
<h1 id="title">Международные грузоперевозки</h1>
<p id="desc">Европа • СНГ • Азия</p>
<a class="btn" href="tel:+79205516575">Позвонить</a>
</div>

<div class="container">
<h2>Оставить заявку</h2>

<form onsubmit="sendForm(event)">
<input id="name" placeholder="Имя" required>
<input id="phone" placeholder="Телефон" required>
<input id="cargo" placeholder="Груз">

<button class="btn">Отправить</button>
</form>

<p id="msg"></p>

<a class="btn" href="https://wa.me/79103273958">WhatsApp</a>
</div>

<script>
function setLang(lang){
if(lang==='en'){
title.innerText="International cargo transportation";
desc.innerText="Europe • CIS • Asia";
}
if(lang==='ge'){
title.innerText="საერთაშორისო გადაზიდვები";
desc.innerText="ევროპა • დსთ • აზია";
}
if(lang==='ru'){
title.innerText="Международные грузоперевозки";
desc.innerText="Европа • СНГ • Азия";
}
}

function sendForm(e){
e.preventDefault();

let name = document.getElementById('name').value;
let phone = document.getElementById('phone').value;
let cargo = document.getElementById('cargo').value;

emailjs.send("service_rjz7d2c","template_6w4m9kf",{
name:name,
phone:phone,
cargo:cargo
});

document.getElementById("msg").innerText="Заявка отправлена!";
}
</script>

</body>
</html>
