<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИМПЕРИАЛ TRANS CARGO</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){ emailjs.init("iBgRJG8GNtKKEUoBM"); })();
</script>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background: radial-gradient(circle at top, #111a33, #0b1220 60%);
color:#fff;
}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.logo-text .main{
font-size:26px;
font-weight:700;
color:#f2d27a;
letter-spacing:2px;
}

.logo-text .sub{
font-size:11px;
opacity:.6;
letter-spacing:2px;
}

.lang button{
margin-left:6px;
background:none;
border:1px solid #444;
color:#fff;
padding:6px 10px;
cursor:pointer;
}

/* HERO */
.hero{
padding:120px 20px 80px;
text-align:center;
max-width:900px;
margin:auto;
}

.hero h1{
font-size:42px;
margin-bottom:15px;
}

.hero p{
opacity:.8;
}

/* TRUST */
.trust{
margin:25px 0;
font-size:15px;
opacity:.9;
}

/* BUTTON */
.btn{
padding:14px 32px;
background:linear-gradient(135deg,#f2d27a,#caa64b);
color:#000;
border-radius:40px;
text-decoration:none;
display:inline-block;
margin-top:15px;
font-weight:600;
}

/* BLOCK */
.container{
padding:70px 20px;
text-align:center;
max-width:1100px;
margin:auto;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
margin-top:40px;
}

.card{
background:#11182b;
padding:25px;
border-radius:16px;
border:1px solid rgba(255,255,255,0.05);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
border:1px solid rgba(242,210,122,0.3);
}

/* FORM */
input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:none;
}
</style>
</head>

<body>

<div class="header">
<div class="logo-text">
<div class="main">ИМПЕРИАЛ</div>
<div class="sub">TRANS CARGO</div>
</div>

<div class="lang">
<button onclick="setLang('ru')">RU</button>
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('ge')">GE</button>
</div>
</div>

<div class="hero">
<h1 id="title">Международные грузоперевозки под ключ</h1>
<p id="desc">Европа • СНГ • Азия</p>

<div class="trust">
📦 Договор &nbsp;&nbsp; 🛡 Страхование &nbsp;&nbsp; 📍 Контроль
</div>

<a class="btn" href="tel:+79205516575">Позвонить</a>
</div>

<div class="container">
<h2>Услуги</h2>

<div class="grid">
<div class="card">🚛 Автоперевозки Европа — СНГ</div>
<div class="card">📦 Карго Турция / Китай</div>
<div class="card">📍 Сборные грузы</div>
</div>
</div>

<div class="container">
<h2>Как работаем</h2>

<div class="grid">
<div class="card">1. Заявка</div>
<div class="card">2. Расчёт</div>
<div class="card">3. Доставка</div>
</div>
</div>

<div class="container">
<h2>Оставить заявку</h2>

<form onsubmit="sendForm(event)" style="max-width:400px;margin:auto;">
<input id="name" placeholder="Имя" required>
<input id="phone" placeholder="Телефон" required>
<input id="cargo" placeholder="Груз">

<button class="btn">Отправить</button>
</form>

<p id="msg"></p>

<a class="btn" href="https://wa.me/79103273958">WhatsApp</a>
</div>

<script>
function setLang(lang){
if(lang==='en'){
title.innerText="International cargo transportation";
desc.innerText="Europe • CIS • Asia";
}
if(lang==='ge'){
title.innerText="საერთაშორისო გადაზიდვები";
desc.innerText="ევროპა • დსთ • აზია";
}
if(lang==='ru'){
title.innerText="Международные грузоперевозки";
desc.innerText="Европа • СНГ • Азия";
}
}

function sendForm(e){
e.preventDefault();

let name = document.getElementById('name').value;
let phone = document.getElementById('phone').value;
let cargo = document.getElementById('cargo').value;

emailjs.send("service_rjz7d2c","template_6w4m9kf",{
name:name,
phone:phone,
cargo:cargo
});

document.getElementById("msg").innerText="Заявка отправлена!";
}
</script>

</body>
</html>
