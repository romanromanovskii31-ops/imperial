<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMPERIAL TRANS CARGO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:'Inter',sans-serif;
background:#020617;
color:#fff;
}

.container{max-width:1200px;margin:auto;padding:20px;}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo{font-weight:700;font-size:20px;}

.lang button{
margin-left:5px;
padding:6px 10px;
border:none;
border-radius:6px;
cursor:pointer;
}

.hero{
position:relative;
height:90vh;
border-radius:20px;
overflow:hidden;
background:url('https://images.unsplash.com/photo-1494412685616-a5d310fbb07d') center/cover no-repeat;
display:flex;
align-items:center;
}

.hero::after{
content:"";
position:absolute;
width:100%;
height:100%;
background:linear-gradient(90deg,#020617 30%, rgba(2,6,23,0.2));
}

.hero-content{
position:relative;
z-index:2;
padding:60px;
max-width:600px;
}

.hero h1{font-size:56px;}

.hero p{margin-top:10px;color:#cbd5f5;}

.btn{
padding:14px 22px;
background:#22c55e;
border:none;
border-radius:10px;
color:#fff;
cursor:pointer;
margin-top:15px;
display:inline-block;
}

.section{margin:80px 0;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
}

.card{
background:rgba(15,23,42,0.6);
backdrop-filter:blur(10px);
padding:20px;
border-radius:12px;
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:none;
background:#0f172a;
color:#fff;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="logo">IMPERIAL TRANS CARGO</div>

<div class="lang">
<button onclick="setLang('ru')">RU</button>
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('ge')">GE</button>
</div>
</div>

<div class="hero">
<div class="hero-content">

<h1 data-key="title"></h1>

<p data-key="hero"></p>

<p style="color:#22c55e;" data-key="fast"></p>

<a href="https://wa.me/79103273958" class="btn" data-key="cta"></a>

</div>
</div>

<div class="section">
<h2 data-key="services"></h2>
<div class="grid">
<div class="card" data-key="s1"></div>
<div class="card" data-key="s2"></div>
<div class="card" data-key="s3"></div>
<div class="card" data-key="s4"></div>
<div class="card" data-key="s5"></div>
<div class="card" data-key="s6"></div>
</div>
</div>

<div class="section">
<h2 data-key="why"></h2>
<div class="grid">
<div class="card" data-key="w1"></div>
<div class="card" data-key="w2"></div>
<div class="card" data-key="w3"></div>
<div class="card" data-key="w4"></div>
</div>
</div>

<div class="section">
<h2 data-key="cases"></h2>
<div class="grid">
<div class="card" data-key="c1"></div>
<div class="card" data-key="c2"></div>
<div class="card" data-key="c3"></div>
</div>
</div>

<div class="section">
<h2 data-key="contact"></h2>
<div class="card" data-key="trust"></div>
</div>

<div class="section">
<h2 data-key="form"></h2>

<form onsubmit="sendForm(event)">
<input id="name" data-placeholder="name">
<input id="phone" data-placeholder="phone">
<textarea id="msg" data-placeholder="msg"></textarea>

<button class="btn" data-key="send"></button>
</form>

<p id="status"></p>

</div>

</div>

<script>

const t={
ru:{
title:"Доставка грузов из Китая, Европы и Турции",

}
};

function setLang(lang){
document.querySelectorAll("[data-key]").forEach(el=>{
el.innerText=t[lang][el.dataset.key]||"";
});

document.querySelectorAll("[data-placeholder]").forEach(el=>{
el.placeholder=t[lang][el.dataset.placeholder]||"";
});
}

setLang("ru");

function sendForm(e){
e.preventDefault();
document.getElementById("status").innerText="OK";
}

</script>

</body>
</html>
