<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>IMPERIAL TRANS CARGO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}

.hero {
  position: relative;
  padding: 120px 20px;
  text-align: center;
  background: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70') center/cover no-repeat;
}

.hero::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(2,6,23,0.75);
}

.hero * { position: relative; z-index: 2; }

.title {
  font-size: 68px;
  font-weight: 900;
  letter-spacing: 4px;
}

.subtitle-main {
  font-size: 28px;
  letter-spacing: 6px;
  color: #38bdf8;
}

.subtitle { color: #94a3b8; }

.services span {
  display: inline-block;
  margin: 5px;
  padding: 8px 14px;
  background: #1e293b;
  border-radius: 8px;
}

.big-btn {
  display: inline-block;
  margin-top: 25px;
  padding: 18px 40px;
  background: #22c55e;
  border-radius: 12px;
  text-decoration: none;
  color: white;
  font-size: 20px;
}

.section {
  padding: 70px 20px;
  text-align: center;
}

.cards {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
  width: 250px;
}

.form input, .form textarea {
  width: 100%;
  max-width: 400px;
  display: block;
  margin: 10px auto;
  padding: 12px;
  border-radius: 8px;
  border: none;
}

button {
  width: 220px;
  padding: 14px;
  background: #38bdf8;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.footer {
  padding: 40px;
  text-align: center;
  background: #020617;
}
</style>
</head>

<body>

<section class="hero">
  <h1 class="title">IMPERIAL</h1>
  <p class="subtitle-main">TRANS CARGO</p>
  <p class="subtitle">Международные грузоперевозки</p>

  <div class="services">
    <span>🚛 Тент</span>
    <span>❄️ Рефрижераторы</span>
    <span>📦 Контейнеры</span>
    <span>✈️ Авиа</span>
  </div>

  <a href="https://wa.me/995597084312" class="big-btn">🚀 Рассчитать стоимость</a>
</section>

<section class="section">
  <h2>Почему выбирают нас</h2>
  <div class="cards">
    <div class="card">⚡ Быстрая доставка</div>
    <div class="card">🌍 Международные направления</div>
    <div class="card">💰 Лучшие цены</div>
    <div class="card">📦 Контроль груза 24/7</div>
  </div>
</section>

<section class="section">
  <h2>Рассчитать стоимость</h2>
  <div class="form">
    <input type="text" id="name" placeholder="Ваше имя">
    <input type="text" id="phone" placeholder="Телефон">
    <textarea id="cargo" placeholder="Опишите груз"></textarea>
    <button onclick="sendTelegram()">Отправить</button>
  </div>
</section>

<section class="footer">
  <h3>Контакты</h3>
  <p>📞 +995 597 084 312</p>
  <p>
    <a href="https://wa.me/995597084312" style="color:#22c55e;">WhatsApp</a> |
    <a href="https://t.me/roman_imperial" style="color:#38bdf8;">Telegram</a>
  </p>
</section>

<script>
function sendTelegram() {
  let name = document.getElementById('name').value.trim();
  let phone = document.getElementById('phone').value.trim();
  let cargo = document.getElementById('cargo').value.trim();

  if (!name || !phone || !cargo) {
    alert("Заполните все поля!");
    return;
  }

  let message = `Новая заявка:%0AИмя: ${name}%0AТелефон: ${phone}%0AГруз: ${cargo}`;

  let token = "ВСТАВИШЬ_НОВЫЙ_ТОКЕН_ЗАВТРА";
  let chat_id = "1118097651";

  fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${message}`)
    .then(res => res.json())
    .then(data => {
      if (data.ok) {
        alert("Заявка отправлена!");
      } else {
        alert("Ошибка!");
      }
    })
    .catch(() => {
      alert("Ошибка соединения!");
    });
}
</script>

</body>
</html>
