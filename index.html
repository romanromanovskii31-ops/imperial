<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИМПЕРИАЛ TRANS CARGO</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
(function(){
emailjs.init("iBgRJG8GNtKKEUoBM");
})();
</script>

<style>
body {
font-family: Arial;
background: #0f172a;
color: white;
text-align: center;
padding: 40px;
}

.container {
max-width: 500px;
margin: auto;
background: #1e293b;
padding: 20px;
border-radius: 10px;
box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

h1 {
margin-bottom: 20px;
}

input, textarea {
width: 100%;
padding: 12px;
margin: 10px 0;
border: none;
border-radius: 6px;
}

button {
background: #22c55e;
color: white;
padding: 12px;
border: none;
border-radius: 6px;
cursor: pointer;
font-size: 16px;
}

button:hover {
background: #16a34a;
}

#msg {
margin-top: 15px;
font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
<h1>ИМПЕРИАЛ TRANS CARGO</h1>

<input type="text" id="name" placeholder="Ваше имя" required>
<input type="text" id="phone" placeholder="Телефон" required>
<textarea id="message" placeholder="Груз / маршрут" required></textarea>

<button onclick="sendMail()">Отправить</button>

<div id="msg"></div>
</div>

<script>
function sendMail(){

let params = {
name: document.getElementById("name").value,
phone: document.getElementById("phone").value,
message: document.getElementById("message").value
};

emailjs.send("service_nsvynwu","template_daooa4d",params)
.then(function(){
document.getElementById("msg").innerText="Заявка отправлена ✅";
})
.catch(function(error){
document.getElementById("msg").innerText="Ошибка ❌";
console.log(error);
});

}
</script>

</body>
</html>
