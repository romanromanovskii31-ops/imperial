<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИМПЕРИАЛ TRANS CARGO</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1220;
color:#fff;
}

header{
padding:20px;
text-align:center;
font-size:22px;
color:#f2d27a;
font-weight:bold;
}

.hero{
text-align:center;
padding:80px 20px;
}

.section{
padding:50px 20px;
text-align:center;
}

.cards{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
}

.card{
background:#121a2f;
padding:20px;
border-radius:10px;
width:250px;
}

.form{
background:#121a2f;
padding:30px;
border-radius:10px;
max-width:400px;
margin:0 auto;
}

input{
width:100%;
margin:10px 0;
padding:10px;
border-radius:6px;
border:none;
}

.btn{
padding:12px;
background:#f2d27a;
color:#000;
border:none;
border-radius:20px;
cursor:pointer;
width:100%;
}

.contacts a{
display:inline-block;
margin:10px;
padding:10px 20px;
background:#f2d27a;
color:#000;
border-radius:20px;
text-decoration:none;
}

#msg{
margin-top:10px;
font-weight:bold;
}
</style>
</head>

<body>

<header>ИМПЕРИАЛ TRANS CARGO</header>

<div class="hero">
<h1>Международные грузоперевозки</h1>
<p>Европа • СНГ • Азия</p>
</div>

<div class="section">
<h2>Услуги</h2>
<div class="cards">
<div class="card">Автоперевозки</div>
<div class="card">ЖД перевозки</div>
<div class="card">Контейнеры</div>
<div class="card">Экспедирование</div>
</div>
</div>

<div class="section">
<h2>Оставить заявку</h2>

<div class="form">
<form onsubmit="sendForm(event)">
<input id="name" placeholder="Имя">
<input id="phone" placeholder="Телефон">
<input id="cargo" placeholder="Груз">
<button class="btn">Отправить</button>
</form>
<p id="msg"></p>
</div>

</div>

<div class="section contacts">
<h2>Контакты</h2>
<a href="https://wa.me/79103273958">WhatsApp</a>
<a href="https://t.me/imperialcargo">Telegram</a>
</div>

<script>
const TOKEN = "8633180088:AAEsPBJAYgXh2NyY1t8Z817WXgmjA2nm9Bc";
const CHAT_ID = "1118097651";

function sendForm(e){
e.preventDefault();

let name = document.getElementById('name').value;
let phone = document.getElementById('phone').value;
let cargo = document.getElementById('cargo').value;

if(!name || !phone || !cargo){
document.getElementById("msg").innerText="Заполните все поля";
return;
}

let text = `🚚 Новая заявка:\nИмя: ${name}\nТелефон: ${phone}\nГруз: ${cargo}`;

fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body: JSON.stringify({
chat_id: CHAT_ID,
text: text
})
})
.then(()=>{
document.getElementById("msg").innerText="Заявка отправлена ✅";
})
.catch(()=>{
document.getElementById("msg").innerText="Ошибка ❌";
});
}
</script>

</body>
</html>
