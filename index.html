<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>IMPERIAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){ emailjs.init("YOUR_PUBLIC_KEY"); })();
</script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}
.container {
  max-width: 600px;
  margin: 100px auto;
  text-align: center;
}
input, textarea {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 8px;
  border: none;
}
button {
  padding: 12px 20px;
  border: none;
  border-radius: 8px;
  background: #22c55e;
  color: white;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="container">
  <h1>IMPERIAL</h1>
  <input type="text" id="name" placeholder="Имя">
  <input type="text" id="phone" placeholder="Телефон">
  <textarea id="cargo" placeholder="Описание груза"></textarea>
  <button onclick="sendForm()">Отправить</button>
</div>

<script>
// === TELEGRAM ===
const TOKEN = "8633180088:AAFg8xzLX2t6I2TDXQ2SUYoiNAuNJhtebQM";
const CHAT_ID = "1118097651";

function sendForm() {
  const name = document.getElementById('name').value;
  const phone = document.getElementById('phone').value;
  const cargo = document.getElementById('cargo').value;

  const message = `Новая заявка:
Имя: ${name}
Телефон: ${phone}
Груз: ${cargo}`;

  // TELEGRAM
  fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      chat_id: CHAT_ID,
      text: message
    })
  });

  // EMAIL
  emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
    name: name,
    phone: phone,
    cargo: cargo
  })
  .then(() => {
    alert("Заявка отправлена");
  })
  .catch(() => {
    alert("Ошибка отправки");
  });
}
</script>

</body>
</html>
