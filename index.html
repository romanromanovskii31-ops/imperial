<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMPERIAL TRANS CARGO</title>

<style>
body{margin:0;font-family:Arial;background:#020617;color:white;}
.header{display:flex;justify-content:space-between;padding:15px 20px;border-bottom:1px solid #1f2937;}
.lang button{margin-left:10px;padding:5px 10px;cursor:pointer;}

.container{max-width:1200px;margin:auto;padding:40px 20px;}

.hero{
height:100vh;
display:flex;
align-items:center;
background:linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.9)),
url('https://images.unsplash.com/photo-1601584115197-04ecc0da31d7');
background-size:cover;
}

h1{font-size:48px;margin:0;}
.subtitle{color:#9ca3af;margin-top:10px;}

.btn{
padding:14px 24px;
background:#22c55e;
color:black;
text-decoration:none;
border-radius:6px;
font-weight:bold;
}

.section{padding:80px 20px;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:#111827;
padding:25px;
border-radius:12px;
}

.block-title{font-size:28px;margin-bottom:20px;}

input,select,textarea{
width:100%;
padding:12px;
margin:10px 0;
border-radius:6px;
border:none;
}

.footer{text-align:center;padding:30px;border-top:1px solid #1f2937;}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<div>IMPERIAL TRANS CARGO</div>
<div class="lang">
<button onclick="setLang('ru')">RU</button>
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('tr')">TR</button>
</div>
</div>

<!-- HERO -->
<div class="hero">
<div class="container">
<h1 id="title"></h1>
<p class="subtitle" id="geo"></p>
<p id="desc"></p>

<div style="margin-top:25px;">
<a class="btn" href="#form" id="btnText"></a>
</div>
</div>
</div>

<!-- SERVICES -->
<div class="section container">
<h2 class="block-title" id="servicesTitle"></h2>
<div class="grid" id="services"></div>
</div>

<!-- FORM -->
<div class="section container" id="form">
<h2 class="block-title" id="formTitle"></h2>

<form onsubmit="sendForm(event)" style="max-width:400px;">
<input type="text" id="name" placeholder="Имя" required>
<input type="text" id="phone" placeholder="Телефон" required>

<select id="type">
<option>Тип перевозки</option>
<option>Авто</option>
<option>Авиа</option>
<option>Море</option>
<option>Карго</option>
</select>

<textarea id="msg" placeholder="Описание груза"></textarea>

<button class="btn" id="btn">Отправить</button>
</form>

<p id="status"></p>
</div>

<div class="footer">© IMPERIAL TRANS CARGO</div>

<script>
const data={
ru:{
title:"Международная логистика под ключ",
geo:"Европа • СНГ • Азия",
desc:"Доставляем грузы даже по сложным маршрутам",
btn:"Оставить заявку",
servicesTitle:"Наши услуги",
formTitle:"Оставить заявку",
services:["🚚 Международные перевозки","📦 Карго","🚛 Авто","✈ Авиа","🚢 Море","📑 Таможня"]
},
en:{
title:"Full-cycle logistics company",
geo:"Europe • CIS • Asia",
desc:"We deliver cargo even on complex routes",
btn:"Send request",
servicesTitle:"Services",
formTitle:"Request form",
services:["Transport","Cargo","Road","Air","Sea","Customs"]
},
tr:{
title:"Uluslararası lojistik şirketi",
geo:"Avrupa • BDT • Asya",
desc:"Zor rotalarda teslimat",
btn:"Talep gönder",
servicesTitle:"Hizmetler",
formTitle:"Talep formu",
services:["Taşımacılık","Kargo","Kara","Hava","Deniz","Gümrük"]
}
};

function setLang(lang){
let d=data[lang];
title.innerText=d.title;
geo.innerText=d.geo;
desc.innerText=d.desc;
btnText.innerText=d.btn;
servicesTitle.innerText=d.servicesTitle;
formTitle.innerText=d.formTitle;

let html="";
d.services.forEach(s=>html+=`<div class="card">${s}</div>`);
services.innerHTML=html;
}

setLang('ru');

function sendForm(e){
e.preventDefault();

let now=new Date();
let time=now.toLocaleString();

let text=`🚚 Новая заявка:
Дата: ${time}
Имя: ${name.value}
Телефон: ${phone.value}
Тип: ${type.value}
Груз: ${msg.value}`;

fetch("https://api.telegram.org/bot8633180088:AAHnQLObBs5pCQfHEOu2m9cKJV-24lIVVUk/sendMessage",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
chat_id:"1118097651",
text:text
})
})
.then(r=>r.json())
.then(d=>{
status.innerText=d.ok?"Отправлено ✅":"Ошибка ❌";
})
.catch(()=>status.innerText="Ошибка сети ❌");
}
</script>

</body>
</html>
