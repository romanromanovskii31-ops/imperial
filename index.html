<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>IMPERIAL TRANS CARGO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}

.hero {
  position: relative;
  padding: 100px 20px;
  text-align: center;
  background: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70') center/cover no-repeat;
}

.hero::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(2,6,23,0.75);
}

.hero * { position: relative; z-index: 2; }

.title {
  font-size: 68px;
  font-weight: 900;
  letter-spacing: 4px;
}

.subtitle-main {
  font-size: 28px;
  letter-spacing: 6px;
  color: #38bdf8;
}

.subtitle { color: #94a3b8; }

.services span {
  display: inline-block;
  margin: 5px;
  padding: 8px 14px;
  background: #1e293b;
  border-radius: 8px;
}

.big-btn {
  display: inline-block;
  margin-top: 20px;
  padding: 18px 40px;
  background: #22c55e;
  border-radius: 12px;
  text-decoration: none;
  color: white;
  font-size: 20px;
}

.section { padding: 60px 20px; text-align: center; }

.form input, .form textarea {
  width: 100%;
  margin: 10px 0;
  padding: 12px;
  border-radius: 8px;
  border: none;
}

button {
  width: 100%;
  padding: 14px;
  background: #38bdf8;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<section class="hero">
  <h1 class="title">IMPERIAL</h1>
  <p class="subtitle-main">TRANS CARGO</p>
  <p class="subtitle">Международные грузоперевозки</p>

  <div class="services">
    <span>🚛 Тент</span>
    <span>❄️ Рефрижераторы</span>
    <span>📦 Контейнеры</span>
    <span>✈️ Авиа</span>
  </div>

  <a href="https://wa.me/995597084312" class="big-btn">🚀 Рассчитать стоимость</a>
</section>

<section class="section">
  <h2>Рассчитать стоимость</h2>
  <div class="form">
    <input type="text" id="name" placeholder="Ваше имя">
    <input type="text" id="phone" placeholder="Телефон">
    <textarea id="cargo" placeholder="Опишите груз"></textarea>
    <button onclick="sendTelegram()">Отправить</button>
  </div>
</section>

<script>
function sendTelegram() {
  let name = document.getElementById('name').value;
  let phone = document.getElementById('phone').value;
  let cargo = document.getElementById('cargo').value;

  let message = `Новая заявка:\nИмя: ${name}\nТелефон: ${phone}\nГруз: ${cargo}`;

  
  let token = 8633180088:AAGWiGxCpZQ35ViK8Z0kp7uw2AcUqbNhkC0;

  // ❗ chat id НЕ МЕНЯЙ
  let chat_id = "123456789";

  fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      chat_id: chat_id,
      text: message
    })
  });

  alert("Заявка отправлена!");
}
</script>

</body>
</html>
