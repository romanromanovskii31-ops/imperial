<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMPERIAL TRANS CARGO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#020617;color:#fff;padding-top:80px;}
.container{max-width:1200px;margin:auto;padding:20px}

.header{
position:fixed;top:0;width:100%;z-index:999;
background:rgba(2,6,23,0.7);
backdrop-filter:blur(10px);
border-bottom:1px solid rgba(255,255,255,0.05);
}
.header-inner{
max-width:1200px;margin:auto;
display:flex;justify-content:space-between;align-items:center;
padding:15px 20px;
}
.logo img{height:40px}

.lang button{
margin-left:8px;padding:6px 10px;border:none;
border-radius:6px;background:#0f172a;color:#fff;cursor:pointer;
}
.lang button:hover{background:#22c55e}

.hero{
height:95vh;border-radius:20px;
background:linear-gradient(120deg,#020617cc,transparent),
url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d') center/cover;
display:flex;align-items:center;
}

.hero-content{padding:60px}
.hero h1{font-size:52px}

.btn{
padding:14px 26px;border-radius:14px;
background:#22c55e;color:#fff;text-decoration:none;
display:inline-block;margin-top:20px;
border:none;
cursor:pointer;
}

.section{margin:100px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}

.card{
background:rgba(15,23,42,.6);
padding:20px;border-radius:16px;
transition:.3s;
}
.card:hover{transform:translateY(-6px)}

input, textarea{
width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:none;
background:#0f172a;
color:#fff;
}

.whatsapp{
position:fixed;bottom:20px;right:20px;
background:#25D366;padding:15px;border-radius:50%;
color:#fff;text-decoration:none;
}
</style>
</head>

<body>

<header class="header">
<div class="header-inner">
<a href="#"><img src="./logo.png" alt="IMPERIAL"></a>
<div class="lang">
<button onclick="setLang('ru')">RU</button>
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('ge')">GE</button>
</div>
</div>
</header>

<div class="container">

<div class="hero">
<div class="hero-content">
<h1 data-key="title"></h1>
<p data-key="hero"></p>
<a href="#form" class="btn" data-key="cta"></a>
</div>
</div>

<div class="section">
<h2 data-key="services"></h2>
<div class="grid">
<div class="card">🚚 <span data-key="s1"></span></div>
<div class="card">📦 <span data-key="s2"></span></div>
<div class="card">🚛 <span data-key="s3"></span></div>
<div class="card">✈️ <span data-key="s4"></span></div>
<div class="card">🚢 <span data-key="s5"></span></div>
<div class="card">📑 <span data-key="s6"></span></div>
</div>
</div>

<div class="section">
<h2 data-key="extra"></h2>
<div class="grid">
<div class="card">💳 <span data-key="e1"></span></div>
<div class="card">🌍 <span data-key="e2"></span></div>
<div class="card">📦 <span data-key="e3"></span></div>
<div class="card">📑 <span data-key="e4"></span></div>
</div>
</div>

<div class="section">
<h2 data-key="cases"></h2>
<div class="grid">
<div class="card" data-key="case1"></div>
<div class="card" data-key="case2"></div>
<div class="card" data-key="case3"></div>
</div>
</div>

<div class="section">
<div class="card" style="text-align:center">
<h2 data-key="cta2"></h2>
<a href="#form" class="btn" data-key="cta"></a>
</div>
</div>

<div class="section" id="form">
<h2 data-key="form"></h2>

<form onsubmit="sendForm(event)">
<input id="name" type="text" data-key="name">
<input id="phone" type="tel" data-key="phone">
<textarea id="msg" data-key="msg"></textarea>

<button class="btn" data-key="send"></button>
</form>

<p id="status"></p>
</div>

</div>

<a href="https://wa.me/79103273958" class="whatsapp">💬</a>

<script>
(function(){emailjs.init("iBgRJG8GNtKKEUoBM");})();

function sendForm(e){
e.preventDefault();

let name = document.getElementById("name").value.trim();
let phone = document.getElementById("phone").value.trim();
let cargo = document.getElementById("msg").value.trim();

if(!name || !phone){
document.getElementById("status").innerText="Введите имя и телефон";
return;
}

let text = `🚚 Новая заявка:
Имя: ${name}
Телефон: ${phone}
Груз: ${cargo || "не указано"}`;

Promise.all([

fetch("https://api.telegram.org/bot8633180088:AAE8Kr9uW6L568rgblJQWiolXNDf0yWhVf4/sendMessage",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
chat_id:"1118097651",
text:text
})
}),

emailjs.send("service_nsvynwu","template_daooa4d",{
name: name,
phone: phone,
cargo: cargo
})

])
.then(()=>{
document.getElementById("status").innerText="Заявка отправлена ✅";
})
.catch(()=>{
document.getElementById("status").innerText="Ошибка ❌";
});

document.getElementById("name").value="";
document.getElementById("phone").value="";
document.getElementById("msg").value="";
}

const t={
ru:{title:"Логистика для бизнеса",hero:"Китай • Европа • СНГ",cta:"Получить расчет",services:"Наши услуги",s1:"Международные перевозки",s2:"Карго доставка",s3:"Автоперевозки",s4:"Авиадоставка",s5:"Морские перевозки",s6:"Таможенное оформление",extra:"Дополнительные услуги",e1:"Агентские платежи",e2:"Аутсорсинг ВЭД",e3:"Параллельный импорт",e4:"Полное сопровождение",cases:"Наши кейсы",case1:"Китай → Москва (-27%)",case2:"Турция → РФ (-18%)",case3:"Европа → РФ (-22%)",cta2:"Получите расчет за 10 минут",form:"Оставить заявку",send:"Отправить",name:"Имя",phone:"Телефон",msg:"Груз"},
en:{title:"Logistics",hero:"China • Europe • CIS",cta:"Get quote",services:"Services",form:"Form",send:"Send",name:"Name",phone:"Phone",msg:"Cargo"},
ge:{title:"ლოგისტიკა",hero:"ჩინეთი • ევროპა",cta:"ფასი",form:"ფორმა",send:"გაგზავნა",name:"სახელი",phone:"ტელეფონი",msg:"ტვირთი"}
};

function setLang(lang){
document.querySelectorAll("[data-key]").forEach(el=>{
let key=el.dataset.key;
if(el.tagName==="INPUT"||el.tagName==="TEXTAREA"){
el.placeholder=t[lang][key]||"";
}else{
el.innerText=t[lang][key]||"";
}
});
}

setLang("ru");
</script>

</body>
</html>
